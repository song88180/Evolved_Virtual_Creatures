<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API Reference - Evol Virtual Creature</title>
    <meta
      name="description"
      content="Detailed API reference for Evol Virtual Creature modules, dataclasses, builders, evaluators, and helpers."
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a class="brand" href="index.html#top" aria-label="Evol Virtual Creature home">
          <span class="brand-mark">EVC</span>
          <span>Evol Virtual Creature</span>
        </a>
        <nav class="top-nav" aria-label="Main navigation">
          <a href="index.html#getting-started">Getting Started</a>
          <a href="index.html#concepts">Concepts</a>
          <a class="active" href="api.html">API Reference</a>
          <a href="index.html#cli-reference">CLI</a>
        </nav>
      </div>
    </header>

    <main id="top" class="api-shell">
      <aside class="sidebar api-sidebar" aria-label="API navigation">
        <nav id="api-module-nav">
          <p class="sidebar-title">API Reference</p>
        </nav>
      </aside>

      <article class="api-content">
        <header class="api-header">
          <p class="eyebrow" id="api-eyebrow">API Reference</p>
          <h1 id="api-title">Evol Virtual Creature API</h1>
          <p class="lede" id="api-description"></p>
        </header>

        <div id="api-modules" aria-live="polite"></div>
      </article>

      <aside class="on-page" aria-label="On this page">
        <p class="sidebar-title">On This Page</p>
        <nav id="api-on-page-nav"></nav>
      </aside>
    </main>

    <script>
      const referencePath = "api-reference.json";
      const moduleNav = document.querySelector("#api-module-nav");
      const onPageNav = document.querySelector("#api-on-page-nav");
      const modulesRoot = document.querySelector("#api-modules");

      const text = (tagName, value, className) => {
        const element = document.createElement(tagName);
        if (className) {
          element.className = className;
        }
        element.textContent = value || "";
        return element;
      };

      const code = (value) => {
        const element = document.createElement("code");
        element.textContent = value || "";
        return element;
      };

      const paragraph = (value) => {
        const element = text("p", value);
        return element;
      };

      const codeBlock = (value) => {
        const pre = document.createElement("pre");
        pre.append(code(value));
        return pre;
      };

      const appendDefinitionList = (parent, items) => {
        const list = document.createElement("dl");
        list.className = "param-list";

        for (const item of items || []) {
          const term = document.createElement("dt");
          term.append(code(item.term));
          if (item.type) {
            term.append(" : ");
            term.append(text("span", item.type));
          }
          list.append(term);

          const description = document.createElement("dd");
          description.textContent = item.description || "";
          list.append(description);
        }

        parent.append(list);
      };

      const appendEntrySection = (parent, section) => {
        parent.append(text("h4", section.title));

        if (section.items) {
          appendDefinitionList(parent, section.items);
        }
        if (section.body) {
          parent.append(paragraph(section.body));
        }
        if (section.code) {
          parent.append(codeBlock(section.code));
        }
      };

      const appendEntry = (parent, entry) => {
        const section = document.createElement("section");
        section.id = entry.id;
        section.className = "api-entry";

        const heading = document.createElement("h3");
        heading.append(code(entry.name));
        section.append(heading);

        if (entry.signature) {
          section.append(codeBlock(entry.signature));
        }
        if (entry.description) {
          section.append(paragraph(entry.description));
        }
        for (const subsection of entry.sections || []) {
          appendEntrySection(section, subsection);
        }

        parent.append(section);
      };

      const appendModule = (parent, module) => {
        const section = document.createElement("section");
        section.id = module.id;
        section.className = "api-module";

        const heading = document.createElement("h2");
        heading.append(code(module.name));
        section.append(heading);

        if (module.description) {
          section.append(paragraph(module.description));
        }
        for (const entry of module.entries || []) {
          appendEntry(section, entry);
        }

        parent.append(section);
      };

      const formatModuleLabel = (moduleName) => moduleName.split(".").pop();

      const findEntryById = (modules, id) => {
        for (const module of modules || []) {
          const entry = (module.entries || []).find((candidate) => candidate.id === id);
          if (entry) {
            return entry;
          }
        }
        return null;
      };

      const renderReference = (reference) => {
        document.title = `${reference.meta?.eyebrow || "API Reference"} - Evol Virtual Creature`;
        document.querySelector("#api-eyebrow").textContent = reference.meta?.eyebrow || "";
        document.querySelector("#api-title").textContent = reference.meta?.title || "";
        document.querySelector("#api-description").textContent = reference.meta?.description || "";

        for (const module of reference.modules || []) {
          const link = text("a", formatModuleLabel(module.name));
          link.href = `#${module.id}`;
          moduleNav.append(link);
          appendModule(modulesRoot, module);
        }

        for (const entryId of reference.onPage || []) {
          const entry = findEntryById(reference.modules, entryId);
          if (!entry) {
            continue;
          }
          const link = text("a", entry.name);
          link.href = `#${entry.id}`;
          onPageNav.append(link);
        }
      };

      const renderError = (error) => {
        const section = document.createElement("section");
        section.className = "api-entry";
        section.append(text("h3", "Could not load API reference"));
        section.append(
          paragraph(
            `The page could not load ${referencePath}. Serve the docs from a local web server or check that the JSON file is present.`
          )
        );
        section.append(codeBlock(String(error)));
        modulesRoot.append(section);
      };

      fetch(referencePath)
        .then((response) => {
          if (!response.ok) {
            throw new Error(`${response.status} ${response.statusText}`);
          }
          return response.json();
        })
        .then(renderReference)
        .catch(renderError);
    </script>
  </body>
</html>
